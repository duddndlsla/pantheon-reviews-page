<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>이영우02의 판테온</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --bg:#0d0f1a;
    --bg-soft:#151a2c;
    --card:#1a2036;
    --gold:#cda238;
    --gold-bright:#e8c15f;
    --crimson:#8c2f2f;
    --ink:#f2ede1;
    --ink-dim:#a9a6bd;
    --border:rgba(205,162,56,0.25);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:radial-gradient(circle at 50% -10%, #22273f 0%, var(--bg) 55%);
    color:var(--ink);
    font-family:"Pretendard","Noto Sans KR",-apple-system,sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 20px;}
  header.hero{
    padding:56px 20px 40px;
    text-align:center;
    border-bottom:1px solid var(--border);
    background:
      radial-gradient(circle at 20% 20%, rgba(205,162,56,0.08), transparent 40%),
      radial-gradient(circle at 80% 0%, rgba(140,47,47,0.15), transparent 45%);
  }
  .eyebrow{
    display:inline-block;
    font-size:12px;
    letter-spacing:.18em;
    color:var(--gold);
    text-transform:uppercase;
    border:1px solid var(--border);
    border-radius:999px;
    padding:6px 14px;
    margin-bottom:18px;
  }
  h1{
    font-size:clamp(36px,9vw,54px);
    margin:0 0 8px;
    font-weight:800;
    letter-spacing:-0.02em;
  }
  h1 span{color:var(--gold-bright);}
  .tagline{color:var(--ink-dim);font-size:15px;margin:0 0 28px;}
  .stats{
    display:flex;justify-content:center;gap:28px;flex-wrap:wrap;
  }
  .stat{text-align:center;}
  .stat .num{font-size:30px;font-weight:800;color:var(--gold-bright);}
  .stat .label{font-size:12px;color:var(--ink-dim);letter-spacing:.05em;}
  .stars-static{color:var(--gold);font-size:15px;letter-spacing:2px;}

  section{padding:36px 20px;}
  .section-title{
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--gold);margin:0 0 16px;font-weight:700;
  }

  form.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:24px;
    display:flex;flex-direction:column;gap:16px;
  }
  label{font-size:13px;color:var(--ink-dim);}
  input[type=text], textarea{
    width:100%;
    background:var(--bg-soft);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    color:var(--ink);
    font-size:15px;
    font-family:inherit;
    resize:vertical;
  }
  input[type=text]:focus, textarea:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .star-picker{display:flex;gap:6px;font-size:32px;}
  .star-picker button{
    background:none;border:none;cursor:pointer;padding:0;
    color:#3a3f57;line-height:1;transition:color .1s, transform .1s;
  }
  .star-picker button.active, .star-picker button:hover{color:var(--gold-bright);transform:scale(1.08);}
  .submit-row{display:flex;justify-content:flex-end;align-items:center;gap:12px;}
  .hint{font-size:12px;color:var(--ink-dim);margin-right:auto;}
  .hint.error{color:#e07a7a;}
  button.pill{
    background:linear-gradient(135deg,var(--gold),#a97e2b);
    color:#141522;
    border:none;
    border-radius:999px;
    padding:12px 26px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  button.pill:disabled{opacity:.5;cursor:default;}

  .review-list{display:flex;flex-direction:column;gap:12px;}
  .review-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px 18px;
  }
  .review-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .nickname{font-weight:700;}
  .review-stars{color:var(--gold);font-size:14px;letter-spacing:1px;white-space:nowrap;}
  .review-comment{margin:8px 0 0;color:var(--ink);font-size:14px;line-height:1.5;white-space:pre-wrap;}
  .review-time{margin-top:8px;font-size:11px;color:var(--ink-dim);}
  .empty{color:var(--ink-dim);font-size:14px;text-align:center;padding:24px 0;}

  footer{text-align:center;padding:28px 20px 0;color:var(--ink-dim);font-size:12px;}
</style>
</head>
<body>

<header class="hero">
  <div class="eyebrow">League of Legends · Player Review</div>
  <h1>이영우02의 <span>판테온</span></h1>
  <p class="tagline">이영우02가 판테온으로 플레이한 경기, 친구들의 평가를 실시간으로 확인해보세요</p>
  <div class="stats">
    <div class="stat">
      <div class="num" id="avg-rating">-</div>
      <div class="label">평균 별점</div>
    </div>
    <div class="stat">
      <div class="num" id="review-count">0</div>
      <div class="label">등록된 후기</div>
    </div>
  </div>
</header>

<div class="wrap">
  <section>
    <p class="section-title">후기 남기기</p>
    <form class="card" id="review-form">
      <div>
        <label for="nickname">내 닉네임</label><br />
        <input type="text" id="nickname" maxlength="30" placeholder="예: 친구1" autocomplete="off" required />
      </div>
      <div>
        <label>별점</label><br />
        <div class="star-picker" id="star-picker" data-rating="0">
          <button type="button" data-value="1">★</button>
          <button type="button" data-value="2">★</button>
          <button type="button" data-value="3">★</button>
          <button type="button" data-value="4">★</button>
          <button type="button" data-value="5">★</button>
        </div>
      </div>
      <div>
        <label for="comment">한줄 평가</label><br />
        <textarea id="comment" rows="3" maxlength="300" placeholder="이영우02의 판테온 플레이, 이번엔 어떄나요?"></textarea>
      </div>
      <div class="submit-row">
        <span class="hint" id="form-hint"></span>
        <button type="submit" class="pill" id="submit-btn">평가 남기기</button>
      </div>
    </form>
  </section>

  <section>
    <p class="section-title">모두의 후기</p>
    <div class="review-list" id="review-list">
      <p class="empty">아직 후기가 없어요. 첫 후기를 남겨보세요!</p>
    </div>
  </section>
</div>

<footer>이영우02의 판테온 플레이, 친구들이 실시간으로 남기는 평가 페이지</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js" integrity="sha384-qafw21c/iciq0VXsi9FzkfoQv5I/V0iqE4lSNcKXPnW9/UTJLnv5CcN4FHxVLnKg" crossorigin="anonymous"></script>
<script>
  const SUPABASE_URL = "https://tacznkiksfgevznberzb.supabase.co";
  const SUPABASE_KEY = "sb_publishable_y75nFzi_w4MnIQoB_eMLng_xIK5u8ia";
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const starPicker = document.getElementById("star-picker");
  const starButtons = Array.from(starPicker.querySelectorAll("button"));
  const form = document.getElementById("review-form");
  const nicknameInput = document.getElementById("nickname");
  const commentInput = document.getElementById("comment");
  const hint = document.getElementById("form-hint");
  const submitBtn = document.getElementById("submit-btn");
  const listEl = document.getElementById("review-list");
  const avgEl = document.getElementById("avg-rating");
  const countEl = document.getElementById("review-count");

  let reviews = [];

  function renderStarPicker(rating) {
    starButtons.forEach((btn) => {
      btn.classList.toggle("active", Number(btn.dataset.value) <= rating);
    });
  }

  starButtons.forEach((btn) => {
    btn.addEventListener("click", () => {
      const value = Number(btn.dataset.value);
      starPicker.dataset.rating = value;
      renderStarPicker(value);
    });
  });

  function starString(n) {
    return "★★★★★☆☆☆☆☆".slice(5 - n, 10 - n);
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function timeAgo(iso) {
    const diffMs = Date.now() - new Date(iso).getTime();
    const min = Math.floor(diffMs / 60000);
    if (min < 1) return "방금 전";
    if (min < 60) return `${min}분 전`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return `${hr}시간 전`;
    return `${Math.floor(hr / 24)}일 전`;
  }

  function renderReviews() {
    countEl.textContent = String(reviews.length);
    if (reviews.length === 0) {
      avgEl.textContent = "-";
      listEl.innerHTML = '<p class="empty">아직 후기가 없어요. 첫 후기를 남겨보세요!</p>';
      return;
    }
    const avg = reviews.reduce((sum, r) => sum + r.rating, 0) / reviews.length;
    avgEl.textContent = avg.toFixed(1);

    listEl.innerHTML = "";
    reviews.forEach((r) => {
      const card = document.createElement("div");
      card.className = "review-card";
      const top = document.createElement("div");
      top.className = "review-top";
      const nick = document.createElement("span");
      nick.className = "nickname";
      nick.textContent = r.nickname;
      const stars = document.createElement("span");
      stars.className = "review-stars";
      stars.textContent = starString(r.rating);
      top.appendChild(nick);
      top.appendChild(stars);
      card.appendChild(top);

      if (r.comment) {
        const comment = document.createElement("p");
        comment.className = "review-comment";
        comment.textContent = r.comment;
        card.appendChild(comment);
      }

      const time = document.createElement("div");
      time.className = "review-time";
      time.textContent = timeAgo(r.created_at);
      card.appendChild(time);

      listEl.appendChild(card);
    });
  }

  async function loadReviews() {
    const { data, error } = await client
      .from("reviews")
      .select("*")
      .order("created_at", { ascending: false })
      .limit(300);
    if (error) {
      console.error(error);
      return;
    }
    reviews = data;
    renderReviews();
  }

  client
    .channel("reviews-realtime")
    .on(
      "postgres_changes",
      { event: "INSERT", schema: "public", table: "reviews" },
      (payload) => {
        reviews = [payload.new, ...reviews];
        renderReviews();
      }
    )
    .subscribe();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    hint.textContent = "";
    hint.classList.remove("error");

    const nickname = nicknameInput.value.trim();
    const rating = Number(starPicker.dataset.rating);
    const comment = commentInput.value.trim();

    if (!nickname) {
      hint.textContent = "닉네임을 입력해주세요";
      hint.classList.add("error");
      return;
    }
    if (!rating) {
      hint.textContent = "별점을 선택해주세요";
      hint.classList.add("error");
      return;
    }
    if (!comment) {
      hint.textContent = "한줄 후기를 입력해주세요";
      hint.classList.add("error");
      return;
    }

    submitBtn.disabled = true;
    const { error } = await client.from("reviews").insert({
      nickname: nickname.slice(0, 30),
      rating,
      comment: comment.slice(0, 300),
    });
    submitBtn.disabled = false;

    if (error) {
      hint.textContent = "등록에 실패했어요. 다시 시도해주세요";
      hint.classList.add("error");
      console.error(error);
      return;
    }

    form.reset();
    starPicker.dataset.rating = "0";
    renderStarPicker(0);
    hint.textContent = "후기가 등록되었습니다!";
  });

  loadReviews();
</script>
</body>
</html>
