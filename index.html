<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>내 실력 ㅁㅌㅊ?</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#060a14;
    --bg-panel:#1e2328;
    --bg-panel-soft:#161a1f;
    --bg-field:#0b0f14;
    --gold:#c8aa6e;
    --gold-bright:#f0e6d2;
    --gold-deep:#785a28;
    --blue:#0ac8b9;
    --blue-deep:#0397ab;
    --crimson:#8b3a3a;
    --ink:#f0e6d2;
    --ink-dim:#a09b8c;
    --border:#3c3c41;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 50% -10%, #10151f 0%, var(--bg) 55%),
      var(--bg);
    color:var(--ink);
    font-family:"Pretendard","Noto Sans KR",-apple-system,sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .display{font-family:"Cinzel","Pretendard","Noto Sans KR",serif;}
  .wrap{max-width:640px;margin:0 auto;padding:0 20px;}

  /* ---- hextech frame ---- */
  .frame{
    border:1px solid var(--gold-deep);
    box-shadow:inset 0 0 0 1px rgba(200,170,110,0.25), 0 0 24px rgba(10,200,185,0.05);
    background:var(--bg-panel);
    border-radius:6px;
  }

  header.hero{
    padding:48px 20px 36px;
    text-align:center;
    border-bottom:1px solid var(--gold-deep);
    background:
      radial-gradient(circle at 20% 10%, rgba(200,170,110,0.10), transparent 45%),
      radial-gradient(circle at 80% 0%, rgba(10,200,185,0.10), transparent 45%);
  }
  .eyebrow{
    display:inline-block;
    font-family:"Cinzel","Pretendard",serif;
    font-size:11px;
    letter-spacing:.22em;
    color:var(--gold);
    text-transform:uppercase;
    border:1px solid var(--gold-deep);
    border-radius:2px;
    padding:6px 16px;
    margin-bottom:18px;
    background:rgba(200,170,110,0.06);
  }
  h1{
    font-size:clamp(32px,8.5vw,50px);
    margin:0 0 10px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  h1 span{
    background:linear-gradient(180deg,var(--gold-bright) 0%, var(--gold) 60%, var(--gold-deep) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .tagline{color:var(--ink-dim);font-size:14px;margin:0 0 20px;}
  .session-line{font-size:12px;color:var(--ink-dim);margin:0 0 22px;}
  .session-line b{color:var(--gold-bright);}
  .logout-btn{
    background:none;border:none;color:var(--blue);font-size:12px;
    cursor:pointer;text-decoration:underline;padding:0;margin-left:8px;
  }
  .logout-btn:hover{color:var(--gold-bright);}
  .stats{
    display:flex;justify-content:center;gap:28px;flex-wrap:wrap;
  }
  .stat{text-align:center;}
  .stat .num{font-family:"Cinzel",serif;font-size:28px;font-weight:700;color:var(--gold-bright);}
  .stat .label{font-size:11px;color:var(--ink-dim);letter-spacing:.08em;}

  section{padding:32px 20px;}
  .section-title{
    display:flex;align-items:center;gap:10px;
    font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--gold);margin:0 0 16px;font-weight:700;
  }
  .section-title::before{
    content:"";width:9px;height:9px;background:var(--gold);
    transform:rotate(45deg);flex-shrink:0;
  }

  /* ---- ranking ---- */
  .rank-list{display:flex;flex-direction:column;gap:8px;margin-bottom:32px;}
  .rank-row{
    display:flex;align-items:center;gap:12px;
    padding:12px 16px;
  }
  .rank-row:nth-child(1){border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(200,170,110,0.5), 0 0 16px rgba(200,170,110,0.15);}
  .rank-num{
    font-family:"Cinzel",serif;
    font-size:16px;font-weight:700;color:var(--gold-bright);width:22px;text-align:center;flex-shrink:0;
  }
  .rank-name{flex:1;font-weight:700;}
  .rank-name .me-tag{color:var(--blue);font-size:11px;font-weight:400;margin-left:6px;}
  .rank-stars{color:var(--gold);font-size:13px;letter-spacing:1px;white-space:nowrap;}
  .rank-avg{font-family:"Cinzel",serif;font-weight:700;color:var(--gold-bright);min-width:32px;text-align:right;}
  .rank-count{font-size:11px;color:var(--ink-dim);min-width:44px;text-align:right;}

  .player-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .player-pill{
    background:var(--bg-panel-soft);border:1px solid var(--gold-deep);color:var(--ink);
    border-radius:2px;padding:10px 18px;font-size:14px;font-weight:700;
    cursor:pointer;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  }
  .player-pill:hover{border-color:var(--gold);color:var(--gold-bright);background:rgba(200,170,110,0.08);}
  .player-pill .me-tag{color:var(--blue);font-size:11px;margin-left:4px;}

  /* ---- back to ranking (big) ---- */
  .back-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;
    background:var(--bg-panel-soft);
    border:1px solid var(--gold);
    color:var(--gold-bright);
    font-size:15px;font-weight:700;
    padding:16px;
    border-radius:4px;
    cursor:pointer;
    margin-bottom:22px;
    letter-spacing:.02em;
  }
  .back-btn:hover{background:rgba(200,170,110,0.12);box-shadow:0 0 18px rgba(200,170,110,0.25);}

  form.card{
    padding:24px;
    display:flex;flex-direction:column;gap:16px;
  }
  label{font-size:13px;color:var(--ink-dim);}
  input[type=text], input[type=password], textarea, select{
    width:100%;
    background:var(--bg-field);
    border:1px solid var(--border);
    border-radius:4px;
    padding:12px 14px;
    color:var(--ink);
    font-size:15px;
    font-family:inherit;
    resize:vertical;
  }
  input:focus, textarea:focus, select:focus{outline:1px solid var(--blue);outline-offset:1px;border-color:var(--blue);}
  .star-picker{display:flex;gap:6px;font-size:32px;}
  .star-picker button{
    background:none;border:none;cursor:pointer;padding:0;
    color:#3a3f45;line-height:1;transition:color .1s, transform .1s;
  }
  .star-picker button.active, .star-picker button:hover{color:var(--gold);transform:scale(1.08);}
  .submit-row{display:flex;justify-content:flex-end;align-items:center;gap:12px;}
  .hint{font-size:12px;color:var(--ink-dim);margin-right:auto;}
  .hint.error{color:#e0736b;}
  button.pill-action, button.pill{
    background:linear-gradient(180deg,var(--blue) 0%, var(--blue-deep) 100%);
    color:#03181a;
    border:1px solid #05e6d4;
    border-radius:2px;
    padding:12px 26px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    box-shadow:0 0 14px rgba(10,200,185,0.35);
  }
  button.pill-action:hover, button.pill:hover{box-shadow:0 0 20px rgba(10,200,185,0.55);}
  button.pill:disabled{opacity:.4;cursor:default;box-shadow:none;}
  .locked-note{
    text-align:center;color:var(--ink-dim);font-size:13px;
    padding:24px;border:1px dashed var(--border);border-radius:6px;
  }

  .review-list{display:flex;flex-direction:column;gap:12px;}
  .review-card{
    padding:16px 18px;
  }
  .review-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .nickname{font-weight:700;color:var(--gold-bright);}
  .review-stars{color:var(--gold);font-size:14px;letter-spacing:1px;white-space:nowrap;}
  .review-comment{margin:8px 0 0;color:var(--ink);font-size:14px;line-height:1.5;white-space:pre-wrap;}
  .review-time{margin-top:8px;font-size:11px;color:var(--ink-dim);}
  .empty{color:var(--ink-dim);font-size:14px;text-align:center;padding:24px 0;}

  .reply-box{
    margin-top:10px;
    padding:10px 12px;
    background:var(--bg-field);
    border-left:2px solid var(--blue);
    border-radius:4px;
    font-size:13px;
    line-height:1.5;
  }
  .reply-box .reply-label{color:var(--blue);font-weight:700;margin-right:6px;}
  .reply-box .reply-text{color:var(--ink);white-space:pre-wrap;}

  .admin-toggle{
    background:none;border:none;color:var(--ink-dim);font-size:12px;
    cursor:pointer;text-decoration:underline;padding:0;
  }
  .admin-toggle:hover{color:var(--gold);}
  .admin-bar{display:flex;justify-content:flex-end;margin:-8px 0 12px;}
  .admin-login{
    display:flex;gap:8px;margin:-8px 0 12px;justify-content:flex-end;
  }
  .admin-login input{
    background:var(--bg-field);border:1px solid var(--border);border-radius:4px;
    padding:6px 10px;color:var(--ink);font-size:13px;max-width:160px;
  }
  .admin-login button{
    background:var(--gold);color:#141522;border:none;border-radius:4px;
    padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;
  }
  .admin-badge{
    display:inline-block;font-size:11px;color:var(--gold);border:1px solid var(--gold-deep);
    border-radius:2px;padding:2px 10px;margin-left:8px;
  }
  .review-admin-controls{
    display:flex;gap:8px;align-items:center;margin-top:10px;
  }
  .review-admin-controls input{
    flex:1;background:var(--bg-field);border:1px solid var(--border);border-radius:4px;
    padding:6px 10px;color:var(--ink);font-size:13px;
  }
  .btn-small{
    border:none;border-radius:4px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;
  }
  .btn-reply{background:var(--gold);color:#141522;}
  .btn-delete{background:var(--crimson);color:#f2ede1;}

  footer{text-align:center;padding:28px 20px 0;color:var(--ink-dim);font-size:12px;}

  .avatar{
    width:24px;height:24px;border-radius:50%;object-fit:cover;
    background:var(--bg-field);border:1px solid var(--gold-deep);flex-shrink:0;
  }
  .avatar-lg{
    width:96px;height:96px;border-radius:50%;object-fit:cover;background-size:cover;
    background-position:center;background-color:var(--bg-field);border:2px solid var(--gold);
  }
  .mypage-card{
    padding:28px;display:flex;flex-direction:column;align-items:center;gap:16px;
  }
  .mypage-card input[type=file]{
    color:var(--ink-dim);font-size:13px;
  }

  /* ---- login gate ---- */
  #login-gate{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .login-card{
    width:100%;max-width:360px;
    padding:32px 28px;
    text-align:center;
  }
  .login-card h2{font-size:22px;margin:4px 0 24px;font-weight:800;}
  .login-card form{display:flex;flex-direction:column;gap:14px;text-align:left;}
  .login-error{color:#e0736b;font-size:13px;min-height:18px;}
</style>
</head>
<body>

<div id="login-gate">
  <div class="login-card frame">

        <span class="hint" id="avatar-hint"></span>

</div>

<footer>같이 게임한 친구들, 실시간으로 남기는 평가 페이지</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js" integrity="sha384-qafw21c/iciq0VXsi9FzkfoQv5I/V0iqE4lSNcKXPnW9/UTJLnv5CcN4FHxVLnKg" crossorigin="anonymous"></script>
<script>
  const SUPABASE_URL = "https://tacznkiksfgevznberzb.supabase.co";
  const SUPABASE_KEY = "sb_publishable_y75nFzi_w4MnIQoB_eMLng_xIK5u8ia";
  const ADMIN_FN_URL = "https://tacznkiksfgevznberzb.supabase.co/functions/v1/pantheon-admin-e8551536c8d3f6d5";
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const PLAYERS = [
    "이영우02",
    "자연스러웠다",
    "탕웨이",
    "삭이꾼",
    "조루반69세",
    "인간장문수",
    "하츄티키글릿로미폼폼핫빛나야",
  ];

  let allReviews = [];
  let profiles = {};
  let currentPlayer = null;
  let currentUser = null;
  let showingMyPage = false;

  function avatarEl(name) {
    const url = profiles[name];
    if (url) {
      const img = document.createElement("img");
      img.className = "avatar";
      img.src = url;
      img.alt = name;
      return img;
    }
    const div = document.createElement("div");
    div.className = "avatar";
    return div;
  }

  async function callFn(payload) {
    const res = await fetch(ADMIN_FN_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    return res.json();
  }

  function starString(n) {
    return "★★★★★☆☆☆☆☆".slice(5 - n, 10 - n);
  }

  function timeAgo(iso) {
    const diffMs = Date.now() - new Date(iso).getTime();
    const min = Math.floor(diffMs / 60000);
    if (min < 1) return "방금 전";
    if (min < 60) return `${min}분 전`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return `${hr}시간 전`;
    return `${Math.floor(hr / 24)}일 전`;
  }

  // ---------- login / session ----------

  const loginGate = document.getElementById("login-gate");
  const appEl = document.getElementById("app");
  const loginForm = document.getElementById("login-form");
  const loginIdSelect = document.getElementById("login-id");
  const loginPasswordInput = document.getElementById("login-password");
  const loginError = document.getElementById("login-error");
  const sessionName = document.getElementById("session-name");
  const logoutBtn = document.getElementById("logout-btn");

  PLAYERS.forEach((name) => {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = name;
    loginIdSelect.appendChild(opt);
  });

  function enterApp(id) {
    currentUser = id;
    sessionName.textContent = id;
    loginGate.hidden = true;
    appEl.hidden = false;
    render();
  }

  function showGate(message) {
    currentUser = null;
    appEl.hidden = true;
    loginGate.hidden = false;
    loginError.textContent = message || "";
  }

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = loginIdSelect.value;
    const password = loginPasswordInput.value.trim();
    if (!password) return;
    loginError.textContent = "";
    const result = await callFn({ action: "login", id, password }).catch(() => null);
    if (result && result.ok) {
      localStorage.setItem("member_session", JSON.stringify({ id, password }));
      loginPasswordInput.value = "";
      enterApp(id);
    } else {
      loginError.textContent = "아이디 또는 비밀번호가 틀렸어요";
    }
  });

  logoutBtn.addEventListener("click", () => {
    localStorage.removeItem("member_session");
    showGate();
  });

  // ---------- my page / avatar ----------

  const mypageBtn = document.getElementById("mypage-btn");
  const mypageBackLink = document.getElementById("mypage-back-link");
  const mypageAvatarPreview = document.getElementById("mypage-avatar-preview");
  const avatarFileInput = document.getElementById("avatar-file-input");
  const avatarSaveBtn = document.getElementById("avatar-save-btn");
  const avatarHint = document.getElementById("avatar-hint");

  let pendingAvatarBlob = null;

  function setAvatarPreview(url) {
    mypageAvatarPreview.style.backgroundImage = url ? `url(${url})` : "none";
  }

  mypageBtn.addEventListener("click", () => {
    showingMyPage = true;
    pendingAvatarBlob = null;
    avatarFileInput.value = "";
    avatarHint.textContent = "";
    setAvatarPreview(profiles[currentUser]);
    render();
  });

  mypageBackLink.addEventListener("click", () => {
    showingMyPage = false;
    goHome();
  });

  async function resizeImage(file, maxSize) {
    const bitmap = await createImageBitmap(file);
    const scale = Math.min(1, maxSize / Math.max(bitmap.width, bitmap.height));
    const w = Math.max(1, Math.round(bitmap.width * scale));
    const h = Math.max(1, Math.round(bitmap.height * scale));
    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    canvas.getContext("2d").drawImage(bitmap, 0, 0, w, h);
    return new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.85));
  }

  avatarFileInput.addEventListener("change", async () => {
    const file = avatarFileInput.files[0];
    if (!file) return;
    if (!file.type.startsWith("image/")) {
      avatarHint.textContent = "이미지 파일만 업로드할 수 있어요";
      return;
    }
    avatarHint.textContent = "미리보기 준비 중...";
    const resized = await resizeImage(file, 256);
    pendingAvatarBlob = resized;
    setAvatarPreview(URL.createObjectURL(resized));
    avatarHint.textContent = "저장 버튼을 눌러 반영하세요";
  });

  avatarSaveBtn.addEventListener("click", async () => {
    if (!pendingAvatarBlob) {
      avatarHint.textContent = "먼저 사진을 선택해주세요";
      return;
    }
    avatarSaveBtn.disabled = true;
    avatarHint.textContent = "업로드 중...";

    const path = `avatar-${PLAYERS.indexOf(currentUser)}.jpg`;
    const { error: upErr } = await client.storage
      .from("avatars")
      .upload(path, pendingAvatarBlob, { upsert: true, contentType: "image/jpeg" });

    if (upErr) {
      avatarHint.textContent = "업로드에 실패했어요";
      avatarSaveBtn.disabled = false;
      return;
    }

    const { data: pub } = client.storage.from("avatars").getPublicUrl(path);
    const avatarUrl = pub.publicUrl + "?t=" + Date.now();

    const { error: dbErr } = await client
      .from("profiles")
      .upsert({ name: currentUser, avatar_url: avatarUrl });

    avatarSaveBtn.disabled = false;

    if (dbErr) {
      avatarHint.textContent = "저장에 실패했어요";
      return;
    }

    profiles[currentUser] = avatarUrl;
    pendingAvatarBlob = null;
    avatarHint.textContent = "프로필 사진이 저장된었어요!";
    render();
  });

  async function trySavedSession() {
    const raw = localStorage.getItem("member_session");
    if (!raw) {
      showGate();
      return;
    }
    let saved;
    try {
      saved = JSON.parse(raw);
    } catch {
      localStorage.removeItem("member_session");
      showGate();
      return;
    }
    const result = await callFn({ action: "login", id: saved.id, password: saved.password }).catch(() => null);
    if (result && result.ok) {
      enterApp(saved.id);
    } else {
      localStorage.removeItem("member_session");
      showGate();
    }
  }

  // ---------- admin ----------

  let adminPasscode = localStorage.getItem("pantheon_admin_passcode") || "";
  let isAdmin = false;

  async function callAdmin(action, extra) {
    return callFn({ action, passcode: adminPasscode, ...extra });
  }

  // ---------- routing ----------

  function parseHash() {
    const m = location.hash.match(/^#player=(.+)$/);
    if (!m) return null;
    const name = decodeURIComponent(m[1]);
    return PLAYERS.includes(name) ? name : null;
  }

  function goHome() {
    location.hash = "";
  }

  function goPlayer(name) {
    location.hash = "player=" + encodeURIComponent(name);
  }

  window.addEventListener("hashchange", () => {
    showingMyPage = false;
    currentPlayer = parseHash();
    render();
  });

  document.getElementById("back-link").addEventListener("click", goHome);

  document.getElementById("player-grid").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-player]");
    if (btn) goPlayer(btn.dataset.player);
  });

  // ---------- rendering ----------

  const viewHome = document.getElementById("view-home");
  const viewPlayer = document.getElementById("view-player");
  const viewMypage = document.getElementById("view-mypage");
  const rankList = document.getElementById("rank-list");
  const playerGrid = document.getElementById("player-grid");
  const playerHeading = document.getElementById("player-heading");
  const totalCountEl = document.getElementById("total-count");
  const reviewForm = document.getElementById("review-form");
  const lockedNote = document.getElementById("locked-note");

  function statsFor(name) {
    const rows = allReviews.filter((r) => r.subject === name);
    const count = rows.length;
    const avg = count ? rows.reduce((s, r) => s + r.rating, 0) / count : 0;
    return { count, avg };
  }

  function renderHome() {
    totalCountEl.textContent = String(allReviews.length);

    const ranked = PLAYERS.map((name) => ({ name, ...statsFor(name) }));
    ranked.sort((a, b) => {
      if (a.count === 0 && b.count === 0) return 0;
      if (a.count === 0) return 1;
      if (b.count === 0) return -1;
      if (b.avg !== a.avg) return b.avg - a.avg;
      return b.count - a.count;
    });

    rankList.innerHTML = "";
    ranked.forEach((p, i) => {
      const row = document.createElement("div");
      row.className = "rank-row frame";

      const num = document.createElement("div");
      num.className = "rank-num";
      num.textContent = String(i + 1);

      const avatar = avatarEl(p.name);

      const name = document.createElement("div");
      name.className = "rank-name";
      name.textContent = p.name;
      if (p.name === currentUser) {
        const me = document.createElement("span");
        me.className = "me-tag";
        me.textContent = "(나)";
        name.appendChild(me);
      }

      const stars = document.createElement("div");
      stars.className = "rank-stars";
      stars.textContent = p.count ? starString(Math.round(p.avg)) : "-";

      const avg = document.createElement("div");
      avg.className = "rank-avg";
      avg.textContent = p.count ? p.avg.toFixed(1) : "-";

      const count = document.createElement("div");
      count.className = "rank-count";
      count.textContent = `${p.count}건`;

      row.appendChild(num);
      row.appendChild(avatar);
      row.appendChild(name);
      row.appendChild(stars);
      row.appendChild(avg);
      row.appendChild(count);
      rankList.appendChild(row);
    });

    playerGrid.innerHTML = "";
    PLAYERS.forEach((name) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "player-pill";
      btn.dataset.player = name;
      btn.style.display = "inline-flex";
      btn.style.alignItems = "center";
      btn.style.gap = "8px";
      btn.appendChild(avatarEl(name));
      const label = document.createElement("span");
      label.textContent = name;
      btn.appendChild(label);
      if (name === currentUser) {
        const me = document.createElement("span");
        me.className = "me-tag";
        me.textContent = "(나)";
        btn.appendChild(me);
      }
      playerGrid.appendChild(btn);
    });
  }

  function renderPlayerReviews() {
    const rows = allReviews.filter((r) => r.subject === currentPlayer);
    const { count, avg } = statsFor(currentPlayer);
    playerHeading.textContent = count
      ? `${currentPlayer} · 평균 ${avg.toFixed(1)}★ (${count}건)`
      : `${currentPlayer} · 아직 후기 없음`;

    const isSelf = currentPlayer === currentUser;
    reviewForm.hidden = isSelf;
    lockedNote.hidden = !isSelf;

    if (rows.length === 0) {
      listEl.innerHTML = '<p class="empty">아직 후기가 없어요. 첫 후기를 남겨보세요!</p>';
      return;
    }

    listEl.innerHTML = "";
    rows.forEach((r) => {
      const card = document.createElement("div");
      card.className = "review-card frame";
      const top = document.createElement("div");
      top.className = "review-top";
      top.style.gap = "8px";
      const nickWrap = document.createElement("span");
      nickWrap.style.display = "inline-flex";
      nickWrap.style.alignItems = "center";
      nickWrap.style.gap = "8px";
      nickWrap.appendChild(avatarEl(r.nickname));
      const nick = document.createElement("span");
      nick.className = "nickname";
      nick.textContent = r.nickname;
      nickWrap.appendChild(nick);
      const stars = document.createElement("span");
      stars.className = "review-stars";
      stars.textContent = starString(r.rating);
      top.appendChild(nickWrap);
      top.appendChild(stars);
      card.appendChild(top);

      if (r.comment) {
        const comment = document.createElement("p");
        comment.className = "review-comment";
        comment.textContent = r.comment;
        card.appendChild(comment);
      }

      const time = document.createElement("div");
      time.className = "review-time";
      time.textContent = timeAgo(r.created_at);
      card.appendChild(time);

      if (r.reply) {
        const replyBox = document.createElement("div");
        replyBox.className = "reply-box";
        const label = document.createElement("span");
        label.className = "reply-label";
        label.textContent = "이영우02:";
        const text = document.createElement("span");
        text.className = "reply-text";
        text.textContent = r.reply;
        replyBox.appendChild(label);
        replyBox.appendChild(text);
        card.appendChild(replyBox);
      }

      if (isAdmin) {
        const controls = document.createElement("div");
        controls.className = "review-admin-controls";

        const replyInput = document.createElement("input");
        replyInput.type = "text";
        replyInput.maxLength = 300;
        replyInput.placeholder = "답글 남기기";
        replyInput.value = r.reply || "";

        const replyBtn = document.createElement("button");
        replyBtn.type = "button";
        replyBtn.className = "btn-small btn-reply";
        replyBtn.textContent = "답글 저장";
        replyBtn.addEventListener("click", () => submitReply(r.id, replyInput.value));

        const deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.className = "btn-small btn-delete";
        deleteBtn.textContent = "삭제";
        deleteBtn.addEventListener("click", () => deleteReview(r.id));

        controls.appendChild(replyInput);
        controls.appendChild(replyBtn);
        controls.appendChild(deleteBtn);
        card.appendChild(controls);
      }

      listEl.appendChild(card);
    });
  }

  function render() {
    if (!currentUser) return;
    if (showingMyPage) {
      viewHome.hidden = true;
      viewPlayer.hidden = true;
      viewMypage.hidden = false;
      return;
    }
    viewMypage.hidden = true;
    if (currentPlayer) {
      viewHome.hidden = true;
      viewPlayer.hidden = false;
      renderPlayerReviews();
    } else {
      viewHome.hidden = false;
      viewPlayer.hidden = true;
      renderHome();
    }
  }

  // ---------- admin ui ----------

  const adminToggle = document.getElementById("admin-toggle");
  const adminLogin = document.getElementById("admin-login");
  const adminPasscodeInput = document.getElementById("admin-passcode");
  const adminBadge = document.getElementById("admin-badge");
  const adminBar = document.getElementById("admin-bar");

  function setAdminUi(on) {
    isAdmin = on;
    adminBadge.hidden = !on;
    adminBar.hidden = on;
    adminLogin.hidden = true;
    render();
  }

  adminToggle.addEventListener("click", () => {
    adminLogin.hidden = false;
    adminBar.hidden = true;
  });

  adminLogin.addEventListener("submit", async (e) => {
    e.preventDefault();
    const value = adminPasscodeInput.value.trim();
    if (!value) return;
    adminPasscode = value;
    const check = await callAdmin("verify", {}).catch(() => null);
    if (check && check.ok) {
      localStorage.setItem("pantheon_admin_passcode", adminPasscode);
      setAdminUi(true);
    } else {
      adminPasscode = localStorage.getItem("pantheon_admin_passcode") || "";
      alert("비밀번호가 틀렸어요");
      adminBar.hidden = false;
      adminLogin.hidden = true;
    }
  });

  async function deleteReview(id) {
    if (!confirm("이 후기를 삭제할까요?")) return;
    const result = await callAdmin("delete", { id }).catch(() => null);
    if (!result || !result.ok) {
      alert("삭제에 실패했어요");
    }
  }

  async function submitReply(id, text) {
    const result = await callAdmin("reply", { id, reply: text }).catch(() => null);
    if (!result || !result.ok) {
      alert("답글 등록에 실패했어요");
    }
  }

  // ---------- review form ----------

  const starPicker = document.getElementById("star-picker");
  const starButtons = Array.from(starPicker.querySelectorAll("button"));
  const form = document.getElementById("review-form");
  const commentInput = document.getElementById("comment");
  const hint = document.getElementById("form-hint");
  const submitBtn = document.getElementById("submit-btn");
  const listEl = document.getElementById("review-list");

  function renderStarPicker(rating) {
    starButtons.forEach((btn) => {
      btn.classList.toggle("active", Number(btn.dataset.value) <= rating);
    });
  }

  starButtons.forEach((btn) => {
    btn.addEventListener("click", () => {
      const value = Number(btn.dataset.value);
      starPicker.dataset.rating = value;
      renderStarPicker(value);
    });
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    hint.textContent = "";
    hint.classList.remove("error");

    const rating = Number(starPicker.dataset.rating);
    const comment = commentInput.value.trim();

    if (!rating) {
      hint.textContent = "별점을 선택해주세요";
      hint.classList.add("error");
      return;
    }
    if (!comment) {
      hint.textContent = "한줄 평가를 입력해주세요";
      hint.classList.add("error");
      return;
    }

    submitBtn.disabled = true;
    const { error } = await client.from("reviews").insert({
      subject: currentPlayer,
      nickname: currentUser,
      rating,
      comment: comment.slice(0, 300),
    });
    submitBtn.disabled = false;

    if (error) {
      hint.textContent = "등록에 실패했어요. 다시 시도해주세요";
      hint.classList.add("error");
      console.error(error);
      return;
    }

    form.reset();
    starPicker.dataset.rating = "0";
    renderStarPicker(0);
    hint.textContent = "후기가 등록되었습니다!";
  });

  // ---------- data + realtime ----------

  async function loadReviews() {
    const { data, error } = await client
      .from("reviews")
      .select("*")
      .order("created_at", { ascending: false })
      .limit(1000);
    if (error) {
      console.error(error);
      return;
    }
    allReviews = data;
    render();
  }

  async function loadProfiles() {
    const { data, error } = await client.from("profiles").select("*");
    if (error) {
      console.error(error);
      return;
    }
    profiles = {};
    data.forEach((p) => {
      profiles[p.name] = p.avatar_url;
    });
    render();
  }

  client
    .channel("profiles-realtime")
    .on(
      "postgres_changes",
      { event: "INSERT", schema: "public", table: "profiles" },
      (payload) => {
        profiles[payload.new.name] = payload.new.avatar_url;
        render();
      }
    )
    .on(
      "postgres_changes",
      { event: "UPDATE", schema: "public", table: "profiles" },
      (payload) => {
        profiles[payload.new.name] = payload.new.avatar_url;
        render();
      }
    )
    .subscribe();

  client
    .channel("reviews-realtime")
    .on(
      "postgres_changes",
      { event: "INSERT", schema: "public", table: "reviews" },
      (payload) => {
        allReviews = [payload.new, ...allReviews];
        render();
      }
    )
    .on(
      "postgres_changes",
      { event: "UPDATE", schema: "public", table: "reviews" },
      (payload) => {
        allReviews = allReviews.map((r) => (r.id === payload.new.id ? payload.new : r));
        render();
      }
    )
    .on(
      "postgres_changes",
      { event: "DELETE", schema: "public", table: "reviews" },
      (payload) => {
        allReviews = allReviews.filter((r) => r.id !== payload.old.id);
        render();
      }
    )
    .subscribe();

  if (adminPasscode) {
    callAdmin("verify", {}).then((r) => {
      if (r && r.ok) setAdminUi(true);
    }).catch(() => {});
  }

  currentPlayer = parseHash();
  trySavedSession();
  loadReviews();
  loadProfiles();
</script>
</body>
</html>
