<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>듀오 랭킹</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --bg:#0d0f1a;
    --bg-soft:#151a2c;
    --card:#1a2036;
    --gold:#cda238;
    --gold-bright:#e8c15f;
    --crimson:#8c2f2f;
    --ink:#f2ede1;
    --ink-dim:#a9a6bd;
    --border:rgba(205,162,56,0.25);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:radial-gradient(circle at 50% -10%, #22273f 0%, var(--bg) 55%);
    color:var(--ink);
    font-family:"Pretendard","Noto Sans KR",-apple-system,sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 20px;}
  header.hero{
    padding:56px 20px 40px;
    text-align:center;
    border-bottom:1px solid var(--border);
    background:
      radial-gradient(circle at 20% 20%, rgba(205,162,56,0.08), transparent 40%),
      radial-gradient(circle at 80% 0%, rgba(140,47,47,0.15), transparent 45%);
  }
  .eyebrow{
    display:inline-block;
    font-size:12px;
    letter-spacing:.18em;
    color:var(--gold);
    text-transform:uppercase;
    border:1px solid var(--border);
    border-radius:999px;
    padding:6px 14px;
    margin-bottom:18px;
  }
  h1{
    font-size:clamp(36px,9vw,54px);
    margin:0 0 8px;
    font-weight:800;
    letter-spacing:-0.02em;
  }
  h1 span{color:var(--gold-bright);}
  .tagline{color:var(--ink-dim);font-size:15px;margin:0 0 28px;}
  .stats{
    display:flex;justify-content:center;gap:28px;flex-wrap:wrap;
  }
  .stat{text-align:center;}
  .stat .num{font-size:30px;font-weight:800;color:var(--gold-bright);}
  .stat .label{font-size:12px;color:var(--ink-dim);letter-spacing:.05em;}

  section{padding:36px 20px;}
  .section-title{
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--gold);margin:0 0 16px;font-weight:700;
  }

  .rank-list{display:flex;flex-direction:column;gap:8px;margin-bottom:32px;}
  .rank-row{
    display:flex;align-items:center;gap:12px;
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:12px 16px;
  }
  .rank-num{
    font-size:16px;font-weight:800;color:var(--gold-bright);width:22px;text-align:center;flex-shrink:0;
  }
  .rank-name{flex:1;font-weight:700;}
  .rank-stars{color:var(--gold);font-size:13px;letter-spacing:1px;white-space:nowrap;}
  .rank-avg{font-weight:800;color:var(--gold-bright);min-width:32px;text-align:right;}
  .rank-count{font-size:11px;color:var(--ink-dim);min-width:44px;text-align:right;}

  .player-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .player-pill{
    background:var(--card);border:1px solid var(--border);color:var(--ink);
    border-radius:999px;padding:10px 18px;font-size:14px;font-weight:700;
    cursor:pointer;
  }
  .player-pill:hover{border-color:var(--gold);color:var(--gold-bright);}

  .back-link{
    background:none;border:none;color:var(--ink-dim);font-size:13px;
    cursor:pointer;padding:0;margin-bottom:18px;text-decoration:underline;
  }
  .back-link:hover{color:var(--gold);}

  form.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:24px;
    display:flex;flex-direction:column;gap:16px;
  }
  label{font-size:13px;color:var(--ink-dim);}
  input[type=text], input[type=password], textarea{
    width:100%;
    background:var(--bg-soft);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    color:var(--ink);
    font-size:15px;
    font-family:inherit;
    resize:vertical;
  }
  input:focus, textarea:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .star-picker{display:flex;gap:6px;font-size:32px;}
  .star-picker button{
    background:none;border:none;cursor:pointer;padding:0;
    color:#3a3f57;line-height:1;transition:color .1s, transform .1s;
  }
  .star-picker button.active, .star-picker button:hover{color:var(--gold-bright);transform:scale(1.08);}
  .submit-row{display:flex;justify-content:flex-end;align-items:center;gap:12px;}
  .hint{font-size:12px;color:var(--ink-dim);margin-right:auto;}
  .hint.error{color:#e07a7a;}
  button.pill{
    background:linear-gradient(135deg,var(--gold),#a97e2b);
    color:#141522;
    border:none;
    border-radius:999px;
    padding:12px 26px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  button.pill:disabled{opacity:.5;cursor:default;}

  .review-list{display:flex;flex-direction:column;gap:12px;}
  .review-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px 18px;
  }
  .review-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .nickname{font-weight:700;}
  .review-stars{color:var(--gold);font-size:14px;letter-spacing:1px;white-space:nowrap;}
  .review-comment{margin:8px 0 0;color:var(--ink);font-size:14px;line-height:1.5;white-space:pre-wrap;}
  .review-time{margin-top:8px;font-size:11px;color:var(--ink-dim);}
  .empty{color:var(--ink-dim);font-size:14px;text-align:center;padding:24px 0;}

  .reply-box{
    margin-top:10px;
    padding:10px 12px;
    background:var(--bg-soft);
    border-left:2px solid var(--gold);
    border-radius:8px;
    font-size:13px;
    line-height:1.5;
  }
  .reply-box .reply-label{color:var(--gold);font-weight:700;margin-right:6px;}
  .reply-box .reply-text{color:var(--ink);white-space:pre-wrap;}

  .admin-toggle{
    background:none;border:none;color:var(--ink-dim);font-size:12px;
    cursor:pointer;text-decoration:underline;padding:0;
  }
  .admin-toggle:hover{color:var(--gold);}
  .admin-bar{display:flex;justify-content:flex-end;margin:-8px 0 12px;}
  .admin-login{
    display:flex;gap:8px;margin:-8px 0 12px;justify-content:flex-end;
  }
  .admin-login input{
    background:var(--bg-soft);border:1px solid var(--border);border-radius:8px;
    padding:6px 10px;color:var(--ink);font-size:13px;max-width:160px;
  }
  .admin-login button{
    background:var(--gold);color:#141522;border:none;border-radius:8px;
    padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;
  }
  .admin-badge{
    display:inline-block;font-size:11px;color:var(--gold);border:1px solid var(--border);
    border-radius:999px;padding:2px 10px;margin-left:8px;
  }
  .review-admin-controls{
    display:flex;gap:8px;align-items:center;margin-top:10px;
  }
  .review-admin-controls input{
    flex:1;background:var(--bg-soft);border:1px solid var(--border);border-radius:8px;
    padding:6px 10px;color:var(--ink);font-size:13px;
  }
  .btn-small{
    border:none;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;
  }
  .btn-reply{background:var(--gold);color:#141522;}
  .btn-delete{background:var(--crimson);color:#f2ede1;}

  footer{text-align:center;padding:28px 20px 0;color:var(--ink-dim);font-size:12px;}
</style>
</head>
<body>

<header class="hero">
  <div class="eyebrow">League of Legends · Duo Ranking</div>
  <h1>우리 듀오 <span>랭킹</span></h1>
  <p class="tagline">같이 게임하는 친구들, 한줄 평가로 랭킹을 매겨보세요</p>
  <div class="stats">
    <div class="stat">
      <div class="num" id="total-count">0</div>
      <div class="label">전체 후기</div>
    </div>
    <div class="stat">
      <div class="num" id="player-count">7</div>
      <div class="label">참가자</div>
    </div>
  </div>
</header>

<div class="wrap">

  <div id="view-home">
    <section>
      <p class="section-title">랭킹</p>
      <div class="rank-list" id="rank-list"></div>

      <p class="section-title">아이디 선택해서 리뷰 남기기</p>
      <div class="player-grid" id="player-grid"></div>
    </section>
  </div>

  <div id="view-player" hidden>
    <section>
      <button type="button" class="back-link" id="back-link">← 랭킹으로</button>
      <p class="section-title" id="player-heading"></p>

      <form class="card" id="review-form">
        <div>
          <label for="nickname">내 닉네임</label><br />
          <input type="text" id="nickname" maxlength="30" placeholder="예: 친구1" autocomplete="off" required />
        </div>
        <div>
          <label>별점</label><br />
          <div class="star-picker" id="star-picker" data-rating="0">
            <button type="button" data-value="1">★</button>
            <button type="button" data-value="2">★</button>
            <button type="button" data-value="3">★</button>
            <button type="button" data-value="4">★</button>
            <button type="button" data-value="5">★</button>
          </div>
        </div>
        <div>
          <label for="comment">한줄 평가</label><br />
          <textarea id="comment" rows="3" maxlength="300" placeholder="이번엔 어땠나요?"></textarea>
        </div>
        <div class="submit-row">
          <span class="hint" id="form-hint"></span>
          <button type="submit" class="pill" id="submit-btn">평가 남기기</button>
        </div>
      </form>
    </section>

    <section>
      <p class="section-title">
        후기 목록<span class="admin-badge" id="admin-badge" hidden>관리자 모드</span>
      </p>
      <div class="admin-bar" id="admin-bar">
        <button type="button" class="admin-toggle" id="admin-toggle">관리자 모드</button>
      </div>
      <form class="admin-login" id="admin-login" hidden>
        <input type="password" id="admin-passcode" placeholder="비밀번호" autocomplete="off" />
        <button type="submit">확인</button>
      </form>
      <div class="review-list" id="review-list"></div>
    </section>
  </div>

</div>

<footer>같이 게임한 친구들, 실시간으로 남기는 평가 페이지</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js" integrity="sha384-qafw21c/iciq0VXsi9FzkfoQv5I/V0iqE4lSNcKXPnW9/UTJLnv5CcN4FHxVLnKg" crossorigin="anonymous"></script>
<script>
  const SUPABASE_URL = "https://tacznkiksfgevznberzb.supabase.co";
  const SUPABASE_KEY = "sb_publishable_y75nFzi_w4MnIQoB_eMLng_xIK5u8ia";
  const ADMIN_FN_URL = "https://tacznkiksfgevznberzb.supabase.co/functions/v1/pantheon-admin-e8551536c8d3f6d5";
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const PLAYERS = [
    "이영우02",
    "자연스러웠다",
    "탕웨이",
    "삭이꾼",
    "조루반69세",
    "인간장문수",
    "하츄티키글릿로미폼폼핫빛나야",
  ];

  let allReviews = [];
  let currentPlayer = null;

  let adminPasscode = localStorage.getItem("pantheon_admin_passcode") || "";
  let isAdmin = false;

  async function callAdmin(action, extra) {
    const res = await fetch(ADMIN_FN_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action, passcode: adminPasscode, ...extra }),
    });
    return res.json();
  }

  function starString(n) {
    return "★★★★★☆☆☆☆☆".slice(5 - n, 10 - n);
  }

  function timeAgo(iso) {
    const diffMs = Date.now() - new Date(iso).getTime();
    const min = Math.floor(diffMs / 60000);
    if (min < 1) return "방금 전";
    if (min < 60) return `${min}분 전`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return `${hr}시간 전`;
    return `${Math.floor(hr / 24)}일 전`;
  }

  // ---------- routing ----------

  function parseHash() {
    const m = location.hash.match(/^#player=(.+)$/);
    if (!m) return null;
    const name = decodeURIComponent(m[1]);
    return PLAYERS.includes(name) ? name : null;
  }

  function goHome() {
    location.hash = "";
  }

  function goPlayer(name) {
    location.hash = "player=" + encodeURIComponent(name);
  }

  window.addEventListener("hashchange", () => {
    currentPlayer = parseHash();
    render();
  });

  document.getElementById("back-link").addEventListener("click", goHome);

  document.getElementById("player-grid").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-player]");
    if (btn) goPlayer(btn.dataset.player);
  });

  // ---------- rendering ----------

  const viewHome = document.getElementById("view-home");
  const viewPlayer = document.getElementById("view-player");
  const rankList = document.getElementById("rank-list");
  const playerGrid = document.getElementById("player-grid");
  const playerHeading = document.getElementById("player-heading");
  const totalCountEl = document.getElementById("total-count");

  function statsFor(name) {
    const rows = allReviews.filter((r) => r.subject === name);
    const count = rows.length;
    const avg = count ? rows.reduce((s, r) => s + r.rating, 0) / count : 0;
    return { count, avg };
  }

  function renderHome() {
    totalCountEl.textContent = String(allReviews.length);

    const ranked = PLAYERS.map((name) => ({ name, ...statsFor(name) }));
    ranked.sort((a, b) => {
      if (a.count === 0 && b.count === 0) return 0;
      if (a.count === 0) return 1;
      if (b.count === 0) return -1;
      if (b.avg !== a.avg) return b.avg - a.avg;
      return b.count - a.count;
    });

    rankList.innerHTML = "";
    ranked.forEach((p, i) => {
      const row = document.createElement("div");
      row.className = "rank-row";

      const num = document.createElement("div");
      num.className = "rank-num";
      num.textContent = String(i + 1);

      const name = document.createElement("div");
      name.className = "rank-name";
      name.textContent = p.name;

      const stars = document.createElement("div");
      stars.className = "rank-stars";
      stars.textContent = p.count ? starString(Math.round(p.avg)) : "-";

      const avg = document.createElement("div");
      avg.className = "rank-avg";
      avg.textContent = p.count ? p.avg.toFixed(1) : "-";

      const count = document.createElement("div");
      count.className = "rank-count";
      count.textContent = `${p.count}건`;

      row.appendChild(num);
      row.appendChild(name);
      row.appendChild(stars);
      row.appendChild(avg);
      row.appendChild(count);
      rankList.appendChild(row);
    });

    playerGrid.innerHTML = "";
    PLAYERS.forEach((name) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "player-pill";
      btn.textContent = name;
      btn.dataset.player = name;
      playerGrid.appendChild(btn);
    });
  }

  function renderPlayerReviews() {
    const rows = allReviews.filter((r) => r.subject === currentPlayer);
    const { count, avg } = statsFor(currentPlayer);
    playerHeading.textContent = count
      ? `${currentPlayer} · 평균 ${avg.toFixed(1)}★ (${count}건)`
      : `${currentPlayer} · 아직 후기 없음`;

    if (rows.length === 0) {
      listEl.innerHTML = '<p class="empty">아직 후기가 없어요. 첫 후기를 남겨보세요!</p>';
      return;
    }

    listEl.innerHTML = "";
    rows.forEach((r) => {
      const card = document.createElement("div");
      card.className = "review-card";
      const top = document.createElement("div");
      top.className = "review-top";
      const nick = document.createElement("span");
      nick.className = "nickname";
      nick.textContent = r.nickname;
      const stars = document.createElement("span");
      stars.className = "review-stars";
      stars.textContent = starString(r.rating);
      top.appendChild(nick);
      top.appendChild(stars);
      card.appendChild(top);

      if (r.comment) {
        const comment = document.createElement("p");
        comment.className = "review-comment";
        comment.textContent = r.comment;
        card.appendChild(comment);
      }

      const time = document.createElement("div");
      time.className = "review-time";
      time.textContent = timeAgo(r.created_at);
      card.appendChild(time);

      if (r.reply) {
        const replyBox = document.createElement("div");
        replyBox.className = "reply-box";
        const label = document.createElement("span");
        label.className = "reply-label";
        label.textContent = "이영우02:";
        const text = document.createElement("span");
        text.className = "reply-text";
        text.textContent = r.reply;
        replyBox.appendChild(label);
        replyBox.appendChild(text);
        card.appendChild(replyBox);
      }

      if (isAdmin) {
        const controls = document.createElement("div");
        controls.className = "review-admin-controls";

        const replyInput = document.createElement("input");
        replyInput.type = "text";
        replyInput.maxLength = 300;
        replyInput.placeholder = "답글 남기기";
        replyInput.value = r.reply || "";

        const replyBtn = document.createElement("button");
        replyBtn.type = "button";
        replyBtn.className = "btn-small btn-reply";
        replyBtn.textContent = "답글 저장";
        replyBtn.addEventListener("click", () => submitReply(r.id, replyInput.value));

        const deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.className = "btn-small btn-delete";
        deleteBtn.textContent = "삭제";
        deleteBtn.addEventListener("click", () => deleteReview(r.id));

        controls.appendChild(replyInput);
        controls.appendChild(replyBtn);
        controls.appendChild(deleteBtn);
        card.appendChild(controls);
      }

      listEl.appendChild(card);
    });
  }

  function render() {
    if (currentPlayer) {
      viewHome.hidden = true;
      viewPlayer.hidden = false;
      renderPlayerReviews();
    } else {
      viewHome.hidden = false;
      viewPlayer.hidden = true;
      renderHome();
    }
  }

  // ---------- admin ----------

  const adminToggle = document.getElementById("admin-toggle");
  const adminLogin = document.getElementById("admin-login");
  const adminPasscodeInput = document.getElementById("admin-passcode");
  const adminBadge = document.getElementById("admin-badge");
  const adminBar = document.getElementById("admin-bar");

  function setAdminUi(on) {
    isAdmin = on;
    adminBadge.hidden = !on;
    adminBar.hidden = on;
    adminLogin.hidden = true;
    render();
  }

  adminToggle.addEventListener("click", () => {
    adminLogin.hidden = false;
    adminBar.hidden = true;
  });

  adminLogin.addEventListener("submit", async (e) => {
    e.preventDefault();
    const value = adminPasscodeInput.value.trim();
    if (!value) return;
    adminPasscode = value;
    const check = await callAdmin("verify", {}).catch(() => null);
    if (check && check.ok) {
      localStorage.setItem("pantheon_admin_passcode", adminPasscode);
      setAdminUi(true);
    } else {
      adminPasscode = localStorage.getItem("pantheon_admin_passcode") || "";
      alert("비밀번호가 틀렸어요");
      adminBar.hidden = false;
      adminLogin.hidden = true;
    }
  });

  if (adminPasscode) {
    callAdmin("verify", {}).then((r) => {
      if (r && r.ok) setAdminUi(true);
    }).catch(() => {});
  }

  async function deleteReview(id) {
    if (!confirm("이 후기를 삭제할까요?")) return;
    const result = await callAdmin("delete", { id }).catch(() => null);
    if (!result || !result.ok) {
      alert("삭제에 실패했어요");
    }
  }

  async function submitReply(id, text) {
    const result = await callAdmin("reply", { id, reply: text }).catch(() => null);
    if (!result || !result.ok) {
      alert("답글 등록에 실패했어요");
    }
  }

  // ---------- review form ----------

  const starPicker = document.getElementById("star-picker");
  const starButtons = Array.from(starPicker.querySelectorAll("button"));
  const form = document.getElementById("review-form");
  const nicknameInput = document.getElementById("nickname");
  const commentInput = document.getElementById("comment");
  const hint = document.getElementById("form-hint");
  const submitBtn = document.getElementById("submit-btn");
  const listEl = document.getElementById("review-list");

  function renderStarPicker(rating) {
    starButtons.forEach((btn) => {
      btn.classList.toggle("active", Number(btn.dataset.value) <= rating);
    });
  }

  starButtons.forEach((btn) => {
    btn.addEventListener("click", () => {
      const value = Number(btn.dataset.value);
      starPicker.dataset.rating = value;
      renderStarPicker(value);
    });
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    hint.textContent = "";
    hint.classList.remove("error");

    const nickname = nicknameInput.value.trim();
    const rating = Number(starPicker.dataset.rating);
    const comment = commentInput.value.trim();

    if (!nickname) {
      hint.textContent = "닉네임을 입력해주세요";
      hint.classList.add("error");
      return;
    }
    if (!rating) {
      hint.textContent = "별점을 선택해주세요";
      hint.classList.add("error");
      return;
    }
    if (!comment) {
      hint.textContent = "한줄 평가를 입력해주세요";
      hint.classList.add("error");
      return;
    }

    submitBtn.disabled = true;
    const { error } = await client.from("reviews").insert({
      subject: currentPlayer,
      nickname: nickname.slice(0, 30),
      rating,
      comment: comment.slice(0, 300),
    });
    submitBtn.disabled = false;

    if (error) {
      hint.textContent = "등록에 실패했어요. 다시 시도해주세요";
      hint.classList.add("error");
      console.error(error);
      return;
    }

    form.reset();
    starPicker.dataset.rating = "0";
    renderStarPicker(0);
    hint.textContent = "후기가 등록되었습니다!";
  });

  // ---------- data + realtime ----------

  async function loadReviews() {
    const { data, error } = await client
      .from("reviews")
      .select("*")
      .order("created_at", { ascending: false })
      .limit(1000);
    if (error) {
      console.error(error);
      return;
    }
    allReviews = data;
    render();
  }

  client
    .channel("reviews-realtime")
    .on(
      "postgres_changes",
      { event: "INSERT", schema: "public", table: "reviews" },
      (payload) => {
        allReviews = [payload.new, ...allReviews];
        render();
      }
    )
    .on(
      "postgres_changes",
      { event: "UPDATE", schema: "public", table: "reviews" },
      (payload) => {
        allReviews = allReviews.map((r) => (r.id === payload.new.id ? payload.new : r));
        render();
      }
    )
    .on(
      "postgres_changes",
      { event: "DELETE", schema: "public", table: "reviews" },
      (payload) => {
        allReviews = allReviews.filter((r) => r.id !== payload.old.id);
        render();
      }
    )
    .subscribe();

  currentPlayer = parseHash();
  loadReviews();
</script>
</body>
</html>
